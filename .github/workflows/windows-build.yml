# Builds the unsigned Windows installer and portable zip and keeps them as a downloadable artifact.
# Same packaging as release.yml (build/build-installer.ps1), without the tests or signing.
# Run it from the Actions tab (Windows build > Run workflow). With "Publish a release" it also creates the GitHub
# release v<version> with the installer, the zip and SHA256SUMS: Tulez's updater offers that release to installed
# copies older than it (it checks the files against SHA256SUMS).
name: Windows build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 2.0.1 (empty uses Directory.Build.props)'
        type: string
        required: false
      publish:
        description: 'Publish a release on this repository'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Version
        id: version
        shell: pwsh
        run: |
          $version = '${{ inputs.version }}'.Trim().TrimStart('v')
          if (-not $version) {
            $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Version '$version' is not like 2.0.1" }
          "value=$version" >> $env:GITHUB_OUTPUT

      # The app embeds the Noto fonts.
      - name: Fonts
        shell: pwsh
        run: ./build/fetch-fonts.ps1

      - name: Restore Zig toolchain
        uses: actions/cache/restore@v5
        with:
          path: build/.cache/zig-x86_64-windows-0.16.0
          key: zig-0.16.0-x86_64-windows

      - name: Build installer and portable zip
        shell: pwsh
        run: ./build/build-installer.ps1 -Version ${{ steps.version.outputs.value }} -Portable

      - uses: actions/upload-artifact@v7
        with:
          name: tulez-windows
          path: Releases/
          if-no-files-found: error
          retention-days: 30

      - name: Publish the release
        if: ${{ inputs.publish }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = '${{ steps.version.outputs.value }}'
          $files = Get-ChildItem Releases -File -Filter "Tulez-$version-*" | ForEach-Object FullName
          if (-not $files) { throw "No Tulez-$version-* files in Releases" }
          gh release create "v$version" --target '${{ github.sha }}' --title "Tulez $version" `
            --notes "Unsigned Windows build of Tulez $version (based on Filee by KnifeLemon). Windows SmartScreen asks once: More info, then Run anyway." @files
